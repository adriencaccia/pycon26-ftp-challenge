name: CodSpeed

on:
  push:
    branches: [codspeed-iteration]
  pull_request:
    branches: [codspeed-iteration]
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.14t (free-threaded)
        run: uv python install 3.14t

      - name: Create venv and install deps
        run: |
          uv venv --python 3.14t .venv
          uv pip install --python .venv/bin/python pytest pytest-codspeed

      - name: Run CodSpeed walltime benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: walltime
          run: .venv/bin/pytest benchmarks/ --codspeed
        env:
          PYTHON_GIL: "0"
